name: catalogue-refresh

# The action catalogue drifts as clouds ship new actions. Regenerate
# weekly and open a PR, so drift is visible rather than silent.
on:
  schedule: [{cron: '0 6 * * 1'}]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Regenerate AWS catalogue
        run: ./scripts/gen-catalogue-aws.sh internal/provider/aws/data/catalogue.json
      # A pull request opened with GITHUB_TOKEN does not trigger the ci
      # workflow, so the suite runs here and a broken snapshot never
      # reaches a PR.
      - run: go build ./... && go test -race -count=1 ./...
      - uses: peter-evans/create-pull-request@v8
        with:
          title: 'chore: refresh action catalogues'
          commit-message: 'chore: refresh action catalogues'
          branch: chore/catalogue-refresh
