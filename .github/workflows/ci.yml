name: ci

on:
  push: {branches: [main]}
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read)
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

  # Enforces the layering rule mechanically rather than by discipline:
  # no core package may import internal/provider/*.
  #
  # "Core" is defined by subtraction -- every internal package that is not
  # under internal/provider -- so a core package added later is covered
  # automatically and cannot quietly escape the rule.
  layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: core must not depend on any provider
        run: |
          set -euo pipefail
          mapfile -t core < <(go list ./internal/... | grep -v '/internal/provider')
          if [ ${#core[@]} -eq 0 ]; then
            echo "::error::found no core packages to check - the layering guard is not running"
            exit 1
          fi
          printf 'checking: %s\n' "${core[@]}"
          # Not piped directly into grep: under set -e a go list failure must
          # abort here, rather than yielding no output and a false pass.
          deps=$(go list -deps "${core[@]}")
          if grep -q 'iamdiff/internal/provider' <<<"$deps"; then
            echo "::error::a core package imports internal/provider - the abstraction has leaked"
            exit 1
          fi
