version: 2
project_name: iamdiff

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/iamdiff
    binary: iamdiff
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Distribution is the tell that separates a tool from a script.
brews:
  - repository:
      owner: IbiliAze
      name: homebrew-tap
    homepage: https://github.com/IbiliAze/iamdiff
    description: Effective cloud IAM permissions diff and explanation

dockers:
  - image_templates:
      - ghcr.io/ibiliaze/iamdiff:{{ .Version }}
      - ghcr.io/ibiliaze/iamdiff:latest

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
