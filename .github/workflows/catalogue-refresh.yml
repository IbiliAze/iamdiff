name: catalogue-refresh

# The action catalogue drifts as clouds ship new actions. Regenerate
# weekly and open a PR, so drift is visible rather than silent.
on:
  schedule: [{cron: '0 6 * * 1'}]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate AWS catalogue
        run: ./scripts/gen-catalogue-aws.sh internal/provider/aws/data/catalogue.json
      - uses: peter-evans/create-pull-request@v6
        with:
          title: 'chore: refresh action catalogues'
          commit-message: 'chore: refresh action catalogues'
          branch: chore/catalogue-refresh
